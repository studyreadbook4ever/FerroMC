plugins { id 'com.android.application' }

android {
    namespace 'dev.ferro.seed'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.ferro.seed'
        minSdk 31
        targetSdk 35
        versionCode 3
        versionName '0.1.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            // Snapdragon 8 Gen 3 / HTP V75 only; dependency audit is in artifacts/.
            excludes += ['**/libQnnDsp*.so', '**/libQnnGpu.so',
                         '**/libQnnHtpV68*.so', '**/libQnnHtpV69*.so',
                         '**/libQnnHtpV73*.so', '**/libQnnHtpV79*.so',
                         '**/libQnnHtpV81*.so']
        }
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android-qnn:1.29.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
